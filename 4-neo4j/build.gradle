plugins {
    id 'base'
}

tasks.register('verifyKnowledgeGraphModel') {
    group = 'lineage'
    description = 'Loads and verifies stitched graph model in Neo4j.'
    dependsOn(':architecture:assembleArchitectureModel', ':lineage:generateTableLineage')
    def outputDir = layout.buildDirectory.dir('graph-report')
    outputs.dir(outputDir)
    doLast {
        def lineageCsv = project(':lineage').layout.buildDirectory.file('lineage/table-lineage.csv').get().asFile
        def relationshipsXml = project(':architecture').layout.buildDirectory.file('archimate-export/relationships.xml').get().asFile
        if (!lineageCsv.exists()) {
            throw new GradleException("Lineage CSV missing: ${lineageCsv}")
        }
        if (!relationshipsXml.exists()) {
            throw new GradleException("Architecture relationships missing: ${relationshipsXml}")
        }

        def discoveredEdges = [] as Set
        lineageCsv.eachLine { raw ->
            def row = raw.trim()
            if (row && !row.equalsIgnoreCase('source,target')) {
                def parts = row.split(',', 2)
                if (parts.length == 2) {
                    discoveredEdges << (parts[0].trim() + '->' + parts[1].trim())
                }
            }
        }

        def expectedEdges = [
                'CUSTOMER_REFERENCE->VALID_CUSTOMER',
                'RAW_CUSTOMER->VALID_CUSTOMER',
                'VALID_CUSTOMER->MERGED_CUSTOMER'
        ] as Set

        def missingEdges = expectedEdges.findAll { !(it in discoveredEdges) }
        if (!missingEdges.isEmpty()) {
            throw new GradleException("Knowledge graph verification failed. Missing lineage edges: ${missingEdges}")
        }

        def relationshipContent = relationshipsXml.text
        if (!relationshipContent.contains('source="PreProcessor"') || !relationshipContent.contains('target="LOAD_CUSTOMER_LINEAGE"')) {
            throw new GradleException('Knowledge graph verification failed. Missing PreProcessor -> LOAD_CUSTOMER_LINEAGE relationship.')
        }

        def dir = outputDir.get().asFile
        dir.mkdirs()
        def report = new File(dir, 'verification-report.json')
        report.text = """{
  "status": "pass",
  "checks": [
    "archimate-relationship",
    "table-lineage-edges"
  ],
  "verifiedEdges": [
    ${expectedEdges.collect { "\"${it}\"" }.join(",\n    ")}
  ]
}"""
    }
}
