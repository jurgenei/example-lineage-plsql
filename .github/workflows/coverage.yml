name: coverage

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v8
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests with coverage
        run: ./gradlew --no-daemon :application:test :application:jacocoTestReport

      - name: Upload coverage reports artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            2-application/build/reports/jacoco/test/**
            2-application/build/reports/tests/test/**
            2-application/build/test-results/test/**

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./2-application/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jurgenei/example-lineage-plsql

