name: Dependency Check

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]
  workflow_dispatch:
  schedule:
    - cron: "27 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          ./gradlew
          :application:dependencyCheckAnalyze
          :knowledgeGraph:dependencyCheckAnalyze
          --no-daemon
          --no-configuration-cache
          --stacktrace

      - name: Upload Dependency-Check HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-html
          path: |
            2-application/build/reports/dependency-check-report.html
            4-knowledge-graph/build/reports/dependency-check-report.html

      - name: Upload Dependency-Check XML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-xml
          path: |
            2-application/build/reports/dependency-check-report.xml
            4-knowledge-graph/build/reports/dependency-check-report.xml

      - name: Upload Dependency-Check JSON reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-json
          path: |
            2-application/build/reports/dependency-check-report.json
            4-knowledge-graph/build/reports/dependency-check-report.json

      - name: Dependency-Check summary
        if: always()
        run: |
          SUPPRESSION_RULES=$(grep -c "<suppress " dependency-check-suppressions.xml || true)
          SUPPRESSED_FINDINGS=$(grep -Rho "<suppressed>true</suppressed>" 2-application/build/reports/dependency-check-report.xml 4-knowledge-graph/build/reports/dependency-check-report.xml 2>/dev/null | wc -l | tr -d ' ')
          SUPPRESSION_SHA=$(sha256sum dependency-check-suppressions.xml | awk '{print $1}')
          echo "### OWASP Dependency-Check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reports uploaded as workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
          echo "- Configured suppression rules: ${SUPPRESSION_RULES}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Suppressed findings in reports: ${SUPPRESSED_FINDINGS}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Suppression file: dependency-check-suppressions.xml" >> "$GITHUB_STEP_SUMMARY"
          echo "- Suppression SHA-256: ${SUPPRESSION_SHA}" >> "$GITHUB_STEP_SUMMARY"
