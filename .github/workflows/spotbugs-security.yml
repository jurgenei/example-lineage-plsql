name: SpotBugs Security

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spotbugs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run SpotBugs + FindSecBugs
        run: >
          ./gradlew
          :application:spotbugsMain
          :knowledgeGraph:spotbugsMain
          -PspotbugsIgnoreFailures=false
          --no-daemon
          --no-configuration-cache
          --stacktrace

      - name: Upload SpotBugs HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-html
          path: |
            2-application/build/reports/spotbugs/main.html
            4-knowledge-graph/build/reports/spotbugs/main.html
