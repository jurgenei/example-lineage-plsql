name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  structure-and-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run structure and contract tests
        run: >
          ./gradlew --no-daemon test
          --tests name.jurgenei.example.lineage.GrowthStructureBootstrapTest
          --tests name.jurgenei.example.lineage.GrowthCrossModuleContractTest
          --tests name.jurgenei.example.lineage.GrowthEndToEndGraphVerificationContractTest

      - name: Upload structure/contract test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure-contract-test-reports
          path: |
            build/reports/tests/test/**
            build/test-results/test/**

  lineage-tests:
    runs-on: ubuntu-latest
    needs: structure-and-contract-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Download structure/contract reports
        uses: actions/download-artifact@v4
        with:
          name: structure-contract-test-reports
          path: artifacts/structure-contract

      - name: Run lineage generation lifecycle
        run: ./gradlew --no-daemon :application:prepareApplicationAssets :lineage:generateTableLineage generateLineage

      - name: Upload lineage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-artifacts
          path: |
            2-application/build/plsql-assets/**
            3-lineage/build/lineage/**
            build/reports/lineage-report.html

  graph-tests:
    runs-on: ubuntu-latest
    needs: lineage-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Download lineage artifacts
        uses: actions/download-artifact@v4
        with:
          name: lineage-artifacts
          path: artifacts/lineage

      - name: Run graph verification lifecycle
        run: ./gradlew --no-daemon assembleArchitecture startNeo4j loadKnowledgeGraph verifyKnowledgeGraph

      - name: Upload graph artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-artifacts
          path: |
            4-neo4j/build/graph-report/**
            build/reports/graph-load-report.html
            build/reports/graph-report.html

  e2e-tests:
    runs-on: ubuntu-latest
    needs: graph-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Download graph artifacts
        uses: actions/download-artifact@v4
        with:
          name: graph-artifacts
          path: artifacts/graph

      - name: Run end-to-end lifecycle
        run: ./gradlew --no-daemon endToEndTest

      - name: Run Oracle lineage integration test
        run: ./gradlew --no-daemon test --tests name.jurgenei.example.lineage.LineageLoaderIntegrationTest

      - name: Upload end-to-end artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: end-to-end-artifacts
          path: |
            build/reports/end-to-end-report.html
            build/reports/tests/test/**
            build/test-results/test/**
