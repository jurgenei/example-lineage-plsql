name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  structure-and-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v8
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run structure and contract tests
        run: >
          ./gradlew --no-daemon :application:test
          --tests name.jurgenei.example.lineage.GrowthStructureBootstrapTest
          --tests name.jurgenei.example.lineage.GrowthCrossModuleContractTest
          --tests name.jurgenei.example.lineage.GrowthEndToEndGraphVerificationContractTest

      - name: Upload structure/contract test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: structure-contract-test-reports
          path: |
            2-application/build/reports/tests/test/**
            2-application/build/test-results/test/**

  lineage-tests:
    runs-on: ubuntu-latest
    needs: structure-and-contract-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v8
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Download structure/contract reports
        uses: actions/download-artifact@v7
        with:
          name: structure-contract-test-reports
          path: artifacts/structure-contract

      - name: Run lineage generation lifecycle
        run: ./gradlew --no-daemon :application:prepareApplicationAssets :lineage:generateTableLineage generateLineage

      - name: Upload lineage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lineage-artifacts
          path: |
            2-application/build/plsql-assets/**
            3-lineage/build/lineage/**
            build/reports/lineage-report.html

  graph-tests:
    runs-on: ubuntu-latest
    needs: lineage-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v8
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Download lineage artifacts
        uses: actions/download-artifact@v7
        with:
          name: lineage-artifacts
          path: artifacts/lineage

      - name: Install Archi runtime
        run: |
          ARCHI_VERSION=5.9.0
          ARCHI_URL="https://github.com/archimatetool/archi.io/releases/download/${ARCHI_VERSION}/Archi-Linux64-${ARCHI_VERSION}.tgz"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            unzip \
            libgtk-3-0 \
            libnss3 \
            libxss1 \
            libxtst6 \
            libxrender1 \
            libxi6 \
            libasound2t64 \
            libglib2.0-0
          curl -fsSL "${ARCHI_URL}" -o /tmp/archi.tgz
          sudo mkdir -p /opt/archi
          sudo tar -xzf /tmp/archi.tgz -C /opt/archi --strip-components=1
          sudo chmod +x /opt/archi/Archi

      - name: Run graph verification lifecycle
        env:
          ARCHI_HOME: /opt/archi
        run: ./gradlew --no-daemon assembleArchitecture startNeo4j loadKnowledgeGraph verifyKnowledgeGraph

      - name: Upload graph artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: graph-artifacts
          path: |
            1-architecture/build/archi-export/**
            4-neo4j/build/graph-report/**
            build/reports/graph-load-report.html
            build/reports/graph-report.html

  e2e-tests:
    runs-on: ubuntu-latest
    needs: graph-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v8
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Download graph artifacts
        uses: actions/download-artifact@v7
        with:
          name: graph-artifacts
          path: artifacts/graph

      - name: Run end-to-end lifecycle
        run: ./gradlew --no-daemon endToEndTest

      - name: Run Oracle lineage integration test
        run: ./gradlew --no-daemon :application:test --tests name.jurgenei.example.lineage.LineageLoaderIntegrationTest

      - name: Upload end-to-end artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: end-to-end-artifacts
          path: |
            build/reports/end-to-end-report.html
            2-application/build/reports/tests/test/**
            2-application/build/test-results/test/**
