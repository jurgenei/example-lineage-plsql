plugins {
    id 'base'
    id 'name.jurgenei.gradle.archi' version '0.1.10'
    id 'name.jurgenei.gradle.xml' version '0.1.11'
}

group = 'name.jurgenei.example.lineage.plsql'
version = '0.1.0'

def archimateInput = file('src/main/resources/archimate/test-lineage.archimate')
def archiExportDir = layout.buildDirectory.dir('archi-export')
def archiXmlOutput = layout.buildDirectory.file('archi-export/test-lineage.export.xml')
def archiModelXmlOutput = layout.buildDirectory.file('archi-export/test-lineage.sexpr')
def archiXlsxOutput = layout.buildDirectory.file('archi-export/test-lineage.xlsx')
def obsoleteExportDir = layout.buildDirectory.dir('archimate-export')

archi {
    input archimateInput
    output archiXmlOutput.get().asFile
    env 'ARCHI_FILE', archimateInput
    env 'PACKAGE_NAME', 'test-lineage'
    env 'EXPORT_DIR', archiExportDir.get().asFile
}

tasks.register('transformArchiModel', name.jurgenei.gradle.xml.XsltTask) {
    group = 'lineage'
    description = 'Transforms Archi Open Exchange export to normalized model XML.'
    dependsOn tasks.named('archi')
    style 'src/main/resources/xsl/archi2model.xsl'
    input archiXmlOutput.get().asFile
    output archiModelXmlOutput.get().asFile
    sexprFormat.set("beautified")
}

tasks.register('assembleArchitectureModel') {
    group = 'lineage'
    description = 'Produces real ArchiMate XML/XLSX/PDF exports and transformed model XML.'
    dependsOn tasks.named('transformArchiModel')
    def pdfDir = layout.buildDirectory.dir('archi-export/pdf')
    inputs.file(archimateInput)
    inputs.file(archiXmlOutput)
    inputs.file(archiModelXmlOutput)
    inputs.file(archiXlsxOutput)
    outputs.dir(archiExportDir)
    doLast {
        delete(obsoleteExportDir.get().asFile)
        if (!archimateInput.exists()) {
            throw new GradleException("ArchiMate model missing: ${archimateInput}")
        }
        if (!archiXmlOutput.get().asFile.exists()) {
            throw new GradleException("Archi XML export missing: ${archiXmlOutput.get().asFile}")
        }
        if (!archiModelXmlOutput.get().asFile.exists()) {
            throw new GradleException("Transformed model XML missing: ${archiModelXmlOutput.get().asFile}")
        }
        if (!archiXlsxOutput.get().asFile.exists()) {
            throw new GradleException("Archi XLSX export missing: ${archiXlsxOutput.get().asFile}")
        }
        def pdfFiles = (pdfDir.get().asFile.listFiles() ?: [] as File[]).findAll { it.isFile() && it.name.endsWith('.pdf') }
        if (pdfFiles.isEmpty()) {
            throw new GradleException("Archi PDF export missing in directory: ${pdfDir.get().asFile}")
        }
    }
}
