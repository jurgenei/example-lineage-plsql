plugins {
    id 'base'
    id 'org.owasp.dependencycheck' version '13.0.0' apply false
    id 'com.github.spotbugs' version '6.5.11' apply false
}

version = '0.1.2'
group = 'name.jurgenei.example.lineage.plsql'

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    version = rootProject.version

    pluginManager.withPlugin('java') {
        apply plugin: 'org.owasp.dependencycheck'
        apply plugin: 'com.github.spotbugs'

        dependencies {
            spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
            constraints {
                implementation('org.apache.commons:commons-lang3:3.20.0')
                implementation('org.apache.logging.log4j:log4j-api:2.26.1')
                implementation('org.apache.logging.log4j:log4j-to-slf4j:2.26.1')
            }
        }

        spotbugs {
            toolVersion = '4.8.3'
        }

        dependencyCheck {
            formats = ['HTML', 'JSON', 'XML']
            failBuildOnCVSS = 7.0
            suppressionFile = rootProject.file('dependency-check-suppressions.xml').absolutePath
            skipConfigurations = ['spotbugs', 'spotbugsPlugins']
            nvd {
                apiKey = project.findProperty('org.owasp.dependencycheck.nvd.api.key') ?: System.getenv('NVD_API_KEY')
            }
        }

        tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
            ignoreFailures = providers.gradleProperty("spotbugsIgnoreFailures")
                    .map { it.toBoolean() }
                    .orElse(true)
                    .get()
            effort = 'default'
            reportLevel = 'medium'
            excludeFilter = rootProject.file('spotbugs-exclude.xml')
            reports.create('html') {
                required = true
            }
            reports.create('xml') {
                required = false
            }
        }
    }
}

def reportsDir = layout.buildDirectory.dir('reports')

def requireFiles = { List<File> files ->
    files.each { file ->
        if (!file.exists()) {
            throw new GradleException("Required artifact missing: ${file}")
        }
    }
}

def writeReport = { String fileName, String title, List<String> lines ->
    def target = reportsDir.get().file(fileName).asFile
    target.parentFile.mkdirs()
    target.text = """<html><head><title>${title}</title></head><body><h1>${title}</h1><ul>${lines.collect { "<li>${it}</li>" }.join('')}</ul></body></html>"""
}

tasks.register('assembleArchitecture') {
    group = 'lineage'
    description = 'Assembles architecture artifacts from architecture project.'
    dependsOn(':architecture:assembleArchitectureModel')
    outputs.file(reportsDir.map { it.file('architecture-report.html') })
    doLast {
        def exportDir = project(':architecture').layout.buildDirectory.dir('archi-export').get().asFile
        def pdfDir = new File(exportDir, 'pdf')
        requireFiles([
                new File(exportDir, 'test-lineage.sexpr'),
                new File(exportDir, 'test-lineage.xlsx')
        ])
        def pdfFiles = (pdfDir.listFiles() ?: [] as File[]).findAll { it.isFile() && it.name.endsWith('.pdf') }
        if (pdfFiles.isEmpty()) {
            throw new GradleException("Required PDF exports missing: ${pdfDir}")
        }
        writeReport('architecture-report.html', 'Architecture Report', [
                "source=${exportDir}",
                "xmlExport=test-lineage.xml",
                "xlsxExport=test-lineage.xlsx",
                "pdfExports=${pdfFiles.collect { it.name }.join(',')}"
        ])
    }
}

tasks.register('generateLineage') {
    group = 'lineage'
    description = 'Generates lineage artifacts from application sources.'
    dependsOn(':application:prepareApplicationAssets', ':lineage:generateTableLineage')

    outputs.file(reportsDir.map { it.file('lineage-report.html') })
    doLast {
        def appDir = project(':application').layout.buildDirectory.dir('plsql-assets').get().asFile
        def lineageAstDir = project(':lineage').layout.buildDirectory.dir('ast').get().asFile
        def lineageExtractDir = project(':lineage').layout.buildDirectory.dir('extract').get().asFile
        requireFiles([
                new File(appDir, 'application-assets.txt')
        ])
        if (!lineageAstDir.exists() || !lineageExtractDir.exists()) {
            throw new GradleException("Lineage outputs missing. Expected directories: ${lineageAstDir}, ${lineageExtractDir}")
        }
        writeReport('lineage-report.html', 'Lineage Report', [
                "applicationAssets=${appDir}",
                "lineageAstDir=${lineageAstDir}",
                "lineageExtractDir=${lineageExtractDir}",
                "mode=stub-ready-for-future-lineage-contract"
        ])
    }
}

tasks.register('startKnowledgeGraph') {
    group = 'lineage'
    description = 'Prepares knowledge graph runtime prerequisites.'
    dependsOn(':knowledgeGraph:startKnowledgeGraphContainer')
    outputs.file(reportsDir.map { it.file('knowledge-graph-start-report.html') })
    doLast {
        def moduleStartReport = project(':knowledgeGraph').layout.buildDirectory.file('graph-report/container-start-report.json').get().asFile
        requireFiles([moduleStartReport])
        writeReport('knowledge-graph-start-report.html', 'Knowledge Graph Start Report', [
                "containerStartReport=${moduleStartReport}",
                'status=ready-for-load'
        ])
    }
}

tasks.register('loadKnowledgeGraph') {
    group = 'lineage'
    description = 'Loads architecture and lineage artifacts into graph model.'
    dependsOn('assembleArchitecture', 'generateLineage', 'startKnowledgeGraph', ':knowledgeGraph:loadKnowledgeGraphStubData')
    outputs.file(reportsDir.map { it.file('graph-load-report.html') })
    doLast {
        def architectureReport = reportsDir.get().file('architecture-report.html').asFile
        def lineageReport = reportsDir.get().file('lineage-report.html').asFile
        def knowledgeGraphStartReport = reportsDir.get().file('knowledge-graph-start-report.html').asFile
        def knowledgeGraphLoadReport = project(':knowledgeGraph').layout.buildDirectory.file('graph-report/load-report.json').get().asFile
        requireFiles([architectureReport, lineageReport, knowledgeGraphStartReport, knowledgeGraphLoadReport])
        writeReport('graph-load-report.html', 'Graph Load Report', [
                "architectureReport=${architectureReport.name}",
                "lineageReport=${lineageReport.name}",
                "knowledgeGraphStartReport=${knowledgeGraphStartReport.name}",
                "knowledgeGraphLoadReport=${knowledgeGraphLoadReport}",
                "status=loaded"
        ])
    }
}

tasks.register('verifyKnowledgeGraph') {
    group = 'verification'
    description = 'Runs graph verification checks.'
    dependsOn('loadKnowledgeGraph', ':knowledgeGraph:verifyKnowledgeGraphModel')
    outputs.file(reportsDir.map { it.file('graph-report.html') })
    doLast {
        def graphLoadReport = reportsDir.get().file('graph-load-report.html').asFile
        def knowledgeGraphReport = project(':knowledgeGraph').layout.buildDirectory.file('graph-report/verification-report.json').get().asFile
        def knowledgeGraphDump = project(':knowledgeGraph').layout.buildDirectory.file('graph-report/graph-dump.json').get().asFile
        requireFiles([graphLoadReport, knowledgeGraphReport, knowledgeGraphDump])
        def verificationJson = knowledgeGraphReport.text
        if (!verificationJson.contains('"status": "pass"')) {
            throw new GradleException("Knowledge graph verification report does not indicate pass: ${knowledgeGraphReport}")
        }
        writeReport('graph-report.html', 'Graph Verification Report', [
                "graphLoadReport=${graphLoadReport.name}",
                "knowledgeGraphVerification=${knowledgeGraphReport}",
                "knowledgeGraphDump=${knowledgeGraphDump}",
                "checks=expected-vertices,expected-relationships,table-lineage",
                "status=pass"
        ])
    }
}

tasks.register('endToEndTest') {
    group = 'verification'
    description = 'Executes full architecture-to-lineage-to-graph scenario.'
    dependsOn('verifyKnowledgeGraph')
    outputs.file(reportsDir.map { it.file('end-to-end-report.html') })
    doLast {
        def architectureReport = reportsDir.get().file('architecture-report.html').asFile
        def lineageReport = reportsDir.get().file('lineage-report.html').asFile
        def graphReport = reportsDir.get().file('graph-report.html').asFile
        requireFiles([architectureReport, lineageReport, graphReport])
        writeReport('end-to-end-report.html', 'End-to-End Report', [
                "step1=${architectureReport.name}",
                "step2=${lineageReport.name}",
                "step3=${graphReport.name}",
                "status=complete"
        ])
    }
}
