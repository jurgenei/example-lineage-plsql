plugins {
    id 'base'
}

tasks.register('generateTableLineage') {
    group = 'lineage'
    description = 'Generates AST, flow graphs, table lineage, and cypher artifacts.'
    dependsOn(':application:prepareApplicationAssets')
    def outputDir = layout.buildDirectory.dir('lineage')
    outputs.dir(outputDir)
    doLast {
        def dir = outputDir.get().asFile
        dir.mkdirs()
        new File(dir, 'asts.xml').text = '<ast source="load_customer_lineage.sql"/>'
        new File(dir, 'flowgraphs.json').text = '{"flows":["RAW_CUSTOMER->VALID_CUSTOMER","VALID_CUSTOMER->MERGED_CUSTOMER"]}'
        new File(dir, 'table-lineage.csv').text = 'source,target\nCUSTOMER_REFERENCE,VALID_CUSTOMER\nRAW_CUSTOMER,VALID_CUSTOMER\nVALID_CUSTOMER,MERGED_CUSTOMER\n'
        new File(dir, 'lineage.cypher').text = 'MERGE (a:Table {name:"RAW_CUSTOMER"}) MERGE (b:Table {name:"VALID_CUSTOMER"}) MERGE (a)-[:WRITES_TO]->(b);'
    }
}
